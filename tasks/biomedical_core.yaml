name: biomedical_core
description: Core biomedical knowledge evaluation tasks
default_num_trials: 3
default_tracked_metrics:
  - type: transcript
    metrics:
      - n_turns
      - n_tool_calls
  - type: latency
    metrics:
      - time_to_last_token

tasks:
  - id: gene_diabetes_association
    question: "What genes are associated with type 1 diabetes?"
    expected_output:
      - type: entities
        value:
          - INS
          - HLA-DRB1
          - HLA-DQB1
          - PTPN22
    tags:
      complexity: complex
    graders:
      - type: code
      - type: model
        rubric: >
          Does the answer correctly identify major genes associated with
          type 1 diabetes? Is it comprehensive and accurate?
    num_trials: 3

  - id: gene_overview_ins
    question: "Tell me about the INS gene and its role in disease."
    expected_output:
      - type: entities
        value:
          - INS
          - ENSG00000254647
          - insulin
    tags:
      complexity: simple
    graders:
      - type: code
    num_trials: 2

  - id: gene_structured_output
    question: "Return a JSON object describing the TP53 gene with fields: symbol (string), name (string), and organism (string)."
    expected_output:
      - type: json_schema
        value:
          type: object
          properties:
            symbol:
              type: string
            name:
              type: string
            organism:
              type: string
          required:
            - symbol
            - name
    tags:
      complexity: simple
    graders:
      - type: code
    num_trials: 1

  - id: gene_query_trajectory
    question: "Query the knowledge graph for TP53 gene details and return them."
    expected_output:
      - type: tool_calls
        value:
          - tool_name: cypher_query
      - type: turn_limit
        value:
          max_turns: 5
      - type: trajectory_pattern
        value:
          - "llm_call"
          - "cypher_query"
          - "llm_call"
    tags:
      complexity: simple
    graders:
      - type: code
    num_trials: 1

  - id: pathway_insulin_signaling
    question: "What are the key genes in the insulin signaling pathway?"
    expected_output:
      - type: entities
        value:
          - INSR
          - IRS1
          - PIK3CA
          - AKT1
      - type: cypher_patterns
        value:
          - "MATCH.*Pathway.*insulin"
    tags:
      complexity: complex
    graders:
      - type: code
      - type: model
        rubric: >
          Does the answer describe the insulin signaling pathway accurately,
          mentioning key receptor and downstream signaling molecules?
    num_trials: 3

  # --- Agent-type-specific evaluation examples ---

  # Coding agent: validate generated code and test results
  - id: coding_agent_gene_parser
    question: "Write a Python function that parses a gene name from a FASTA header line."
    expected_output:
      - type: code_valid
        value:
          language: python
      - type: test_results
        value:
          expected_tests:
            - test_parse_simple_header
            - test_parse_with_description
    tags:
      complexity: simple
      agent_type: coding
    graders:
      - type: code
    num_trials: 1

  # Research agent: verify citations and topic coverage
  - id: research_agent_brca1_review
    question: "Summarize recent research on BRCA1 mutations and breast cancer risk."
    expected_output:
      - type: keyword_coverage
        value:
          keywords:
            - BRCA1
            - breast cancer
            - mutation
            - risk
      - type: groundedness
        value:
          min_citations: 2
    tags:
      complexity: complex
      agent_type: research
    graders:
      - type: code
      - type: model
        rubric: >
          Does the summary accurately describe BRCA1 mutations and their
          association with breast cancer? Are claims supported by cited sources?
    num_trials: 1

  # Conversational/computer-use agent: verify state changes
  - id: conversational_agent_update_record
    question: "Update the patient record to mark allergy status as 'penicillin' and set priority to 'high'."
    expected_output:
      - type: state_check
        value:
          assertions:
            patient.allergy: penicillin
            patient.priority: high
    tags:
      complexity: simple
      agent_type: conversational
    graders:
      - type: code
    num_trials: 1
